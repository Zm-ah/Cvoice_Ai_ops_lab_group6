[project]
name = "cvoice-ai-ops-lab-group6"
version = "0.1.0"
description = "Talk to my BOT: upload a CV and talk with a bot that answers as the person"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "backend",
    "frontend",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "pre-commit"
]

[tool.ruff]
line-length = 100
src = ["backend/src", "frontend/src"]

[tool.ruff.lint]
select = ["E", "F", "I"]