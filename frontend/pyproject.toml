[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cvoice-frontend"
version = "0.1.0"
description = "Streamlit frontend for cvoice"
requires-python = ">=3.11"
dependencies = [
    "streamlit",
    "httpx",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/cvoice_frontend"]
