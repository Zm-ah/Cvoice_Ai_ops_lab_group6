name: CI 
on: 
  pull_request:
    branches: [main]


jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true 

      - name: Install dependencies 
        run: uv sync --all-packages --locked

      - name: lint with ruff
        run : uv run ruff check 

      - name: Run tests 
        run: uv run pytest backend/tests frontend/tests
