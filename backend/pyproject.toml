[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cvoice-backend"
version = "0.1.0"
description = "FastAPI backend for cvoice"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "python-dotenv",
    "python-multipart",
    "pydantic-ai",
    "lancedb==0.17.0",
    "logfire[fastapi,variables]",
]

[project.optional-dependencies]
dev = ["pytest", "httpx","ipykernel"]

[tool.hatch.build.targets.wheel]
packages = ["src/cvoice_backend"]



