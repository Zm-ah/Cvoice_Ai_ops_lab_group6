[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cvoice-backend"
version = "0.1.0"
description = "FastAPI backend for cvoice"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "python-dotenv",
    "python-multipart",
    "pydantic-ai",
    # 0.41 -> the version the course material uses
    # also, the embedding registry API in this code does not exist in the old pin.
    "lancedb>=0.41.0",
    "logfire[fastapi,variables]",
    "pypdf>=6",
    # Nvidia Build speaks the OpenAI API: used by the embedding function.
    "openai>=2",
    # Imported directly by embedders.py, so it is declared
    # rather than relying on something lancedb happens to install.
    "numpy>=2",
]

[project.optional-dependencies]
dev = ["pytest", "httpx","ipykernel"]

[tool.hatch.build.targets.wheel]
packages = ["src/cvoice_backend"]