[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cvoice-backend"
version = "0.1.0"
description = "FastAPI backend for cvoice"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "python-dotenv",
    "python-multipart",
    # TODO: add as the team needs them, for example:
    # "pydantic-ai", "lancedb", "logfire"
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.hatch.build.targets.wheel]
packages = ["src/cvoice_backend"]
